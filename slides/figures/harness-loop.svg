<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 400' width='1080' height='400' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#656665'/></marker></defs>
<line x1='337' y1='92' x2='404' y2='140' stroke='#9aa0a8' stroke-width='3' marker-end='url(#a)'/><line x1='428' y1='212' x2='403' y2='291' stroke='#9aa0a8' stroke-width='3' marker-end='url(#a)'/><line x1='342' y1='336' x2='260' y2='336' stroke='#9aa0a8' stroke-width='3' marker-end='url(#a)'/><line x1='198' y1='293' x2='172' y2='214' stroke='#9aa0a8' stroke-width='3' marker-end='url(#a)'/><line x1='195' y1='142' x2='261' y2='93' stroke='#9aa0a8' stroke-width='3' marker-end='url(#a)'/><circle cx='300' cy='65' r='42' fill='#fff' stroke='#2b2b2b' stroke-width='2.5'/><text x='300' y='75' text-anchor='middle' font-size='30'>📝</text><circle cx='330' cy='35' r='14' fill='#2b2b2b'/><text x='330.0' y='40.0' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">1</text><circle cx='443' cy='169' r='42' fill='#fff' stroke='#2b2b2b' stroke-width='2.5'/><text x='443' y='179' text-anchor='middle' font-size='30'>🤖</text><circle cx='473' cy='139' r='14' fill='#2b2b2b'/><text x='472.658477444273' y='143.6474508437579' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">2</text><circle cx='388' cy='336' r='42' fill='#fff' stroke='#D50032' stroke-width='2.5'/><text x='388' y='346' text-anchor='middle' font-size='30'>🔑</text><circle cx='418' cy='306' r='14' fill='#D50032'/><text x='418.167787843871' y='311.3525491562421' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">3</text><circle cx='212' cy='336' r='42' fill='#fff' stroke='#2b2b2b' stroke-width='2.5'/><text x='212' y='346' text-anchor='middle' font-size='30'>🖥️</text><circle cx='242' cy='306' r='14' fill='#2b2b2b'/><text x='241.83221215612906' y='311.3525491562421' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">4</text><circle cx='157' cy='169' r='42' fill='#fff' stroke='#2b2b2b' stroke-width='2.5'/><text x='157' y='179' text-anchor='middle' font-size='30'>📎</text><circle cx='187' cy='139' r='14' fill='#2b2b2b'/><text x='187.34152255572695' y='143.6474508437579' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">5</text><text x='300' y='207' font-size='15' fill='#656665' text-anchor='middle'>until the model</text><text x='300' y='227' font-size='15' fill='#656665' text-anchor='middle'>says "done"</text><text x='300' y='247' font-size='13' fill='#656665' text-anchor='middle'>or the budget runs out</text><circle cx='530' cy='54' r='14' fill='#001E62'/><text x='530' y='59' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">1</text><text x='556' y='60' font-size='20' fill='#001E62' text-anchor='start' font-weight="700">Build the prompt</text><text x='556' y='84' font-size='15' fill='#656665' text-anchor='start'>system rules + transcript + tool results</text><circle cx='530' cy='120' r='14' fill='#001E62'/><text x='530' y='125' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">2</text><text x='556' y='126' font-size='20' fill='#001E62' text-anchor='start' font-weight="700">Call the model</text><text x='556' y='150' font-size='15' fill='#656665' text-anchor='start'>one inference, returns text or a tool call</text><circle cx='530' cy='186' r='14' fill='#D50032'/><text x='530' y='191' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">3</text><text x='556' y='192' font-size='20' fill='#D50032' text-anchor='start' font-weight="700">Check permission</text><text x='556' y='216' font-size='15' fill='#656665' text-anchor='start'>allow · ask the human · deny</text><circle cx='530' cy='252' r='14' fill='#001E62'/><text x='530' y='257' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">4</text><text x='556' y='258' font-size='20' fill='#001E62' text-anchor='start' font-weight="700">Run the tool</text><text x='556' y='282' font-size='15' fill='#656665' text-anchor='start'>in the sandbox; capture output</text><circle cx='530' cy='318' r='14' fill='#001E62'/><text x='530' y='323' font-size='15' fill='#fff' text-anchor='middle' font-weight="700">5</text><text x='556' y='324' font-size='20' fill='#001E62' text-anchor='start' font-weight="700">Append the result</text><text x='556' y='348' font-size='15' fill='#656665' text-anchor='start'>to the transcript; compact if too long</text><rect x='820' y='48' width='240' height='330' rx='14' fill='#f4f6fa' stroke='#c9ced8'/><text x='940' y='80' font-size='17' fill='#001E62' text-anchor='middle' font-weight="700">Harnesses you can run</text><text x='840' y='118' font-size='17' fill='#2b2b2b' text-anchor='start' font-weight="700">Claude Code</text><text x='1040' y='118' font-size='14' fill='#656665' text-anchor='end'>terminal</text><text x='840' y='152' font-size='17' fill='#2b2b2b' text-anchor='start' font-weight="700">Codex CLI</text><text x='1040' y='152' font-size='14' fill='#656665' text-anchor='end'>terminal</text><text x='840' y='186' font-size='17' fill='#2b2b2b' text-anchor='start' font-weight="700">Cursor · Copilot</text><text x='1040' y='186' font-size='14' fill='#656665' text-anchor='end'>editor</text><text x='840' y='220' font-size='17' fill='#2b2b2b' text-anchor='start' font-weight="700">OpenHands</text><text x='1040' y='220' font-size='14' fill='#656665' text-anchor='end'>open source</text><text x='840' y='254' font-size='17' fill='#2b2b2b' text-anchor='start' font-weight="700">Buttercup</text><text x='1040' y='254' font-size='14' fill='#656665' text-anchor='end'>AIxCC</text><text x='940' y='310' font-size='14' fill='#656665' text-anchor='middle'>Same model, different</text><text x='940' y='330' font-size='14' fill='#656665' text-anchor='middle'>harness = different agent.</text><text x='940' y='360' font-size='14' fill='#0A4FA3' text-anchor='middle' font-weight="700">MCP = plug for new tools</text>
</svg>
