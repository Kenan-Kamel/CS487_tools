<rect x='20' y='20' width='330' height='120' rx='16' fill='#fff' stroke='#2b2b2b' stroke-width='2.2'/><text x='70' y='95' text-anchor='middle' font-size='44'>💬</text><text x='115' y='60' font-size='23' fill='#2b2b2b' text-anchor='start' font-weight="700">Text and code</text><text x='115' y='88' font-size='16' fill='#0A4FA3' text-anchor='start'>large language model (LLM)</text><text x='115' y='116' font-size='15' fill='#656665' text-anchor='start'>ChatGPT · Claude · Gemini</text><rect x='370' y='20' width='330' height='120' rx='16' fill='#fff' stroke='#2b2b2b' stroke-width='2.2'/><text x='420' y='95' text-anchor='middle' font-size='44'>🖼️</text><text x='465' y='60' font-size='23' fill='#2b2b2b' text-anchor='start' font-weight="700">Images and video</text><text x='465' y='88' font-size='16' fill='#0A4FA3' text-anchor='start'>diffusion model</text><text x='465' y='116' font-size='15' fill='#656665' text-anchor='start'>Midjourney · Stable Diffusion</text><rect x='720' y='20' width='330' height='120' rx='16' fill='#fff' stroke='#2b2b2b' stroke-width='2.2'/><text x='770' y='95' text-anchor='middle' font-size='44'>🎙️</text><text x='815' y='60' font-size='23' fill='#2b2b2b' text-anchor='start' font-weight="700">Speech and audio</text><text x='815' y='88' font-size='16' fill='#0A4FA3' text-anchor='start'>speech / audio model</text><text x='815' y='116' font-size='15' fill='#656665' text-anchor='start'>Whisper · ElevenLabs</text><text x='540' y='178' font-size='17' fill='#656665' text-anchor='middle'>GenAI: learn the pattern from data, then generate new content from a prompt. Same idea in every box; this lecture is the first one.</text><rect x='20' y='205' width='1040' height='185' rx='16' fill='#f4f6fa' stroke='#c9ced8'/><text x='40' y='237' font-size='19' fill='#001E62' text-anchor='start' font-weight="700">What an LLM actually does: predict the next token, append it, repeat</text><rect x='40' y='265' width='300' height='56' rx='10' fill='#fff' stroke='#2b2b2b'/><text x='19