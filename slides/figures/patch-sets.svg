<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 420' width='1080' height='420' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#656665'/></marker></defs>
<ellipse cx='330' cy='210' rx='320' ry='190' fill='#eef2f8' stroke='#656665' stroke-width='2'/><ellipse cx='300' cy='225' rx='215' ry='135' fill='#dbe6f6' stroke='#0A4FA3' stroke-width='2.5'/><circle cx='250' cy='250' r='40' fill='#D50032' stroke='none'/><text x='330' y='55' font-size='19' fill='#656665' text-anchor='middle' font-weight="700">Patches that stop the PoC crash</text><text x='330' y='78' font-size='16' fill='#656665' text-anchor='middle'>"plausible"</text><text x='300' y='125' font-size='19' fill='#0A4FA3' text-anchor='middle' font-weight="700">...that also pass every test</text><text x='300' y='148' font-size='16' fill='#0A4FA3' text-anchor='middle'>what the agent reports as done</text><text x='250' y='256' font-size='17' fill='#fff' text-anchor='middle' font-weight="700">correct</text><line x1='700' y1='300' x2='300' y2='268' stroke='#D50032' stroke-width='2.5' marker-end='url(#a)'/><text x='720' y='290' font-size='20' fill='#D50032' text-anchor='start' font-weight="700">The thing you want.</text><text x='720' y='318' font-size='17' fill='#2b2b2b' text-anchor='start'>Rinard's group found it is</text><text x='720' y='342' font-size='17' fill='#2b2b2b' text-anchor='start'>"orders of magnitude" less</text><text x='720' y='366' font-size='17' fill='#2b2b2b' text-anchor='start'>common than the blue ring.</text><text x='720' y='110' font-size='20' fill='#001E62' text-anchor='start' font-weight="700">Implausible patches</text><text x='720' y='138' font-size='17' fill='#2b2b2b' text-anchor='start'>live outside the outer ring:</text><text x='720' y='162' font-size='17' fill='#2b2b2b' text-anchor='start'>the PoC still crashes.</text>
</svg>
