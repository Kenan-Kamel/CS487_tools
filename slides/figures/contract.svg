<rect x='40' y='60' width='220' height='90' rx='10' fill='#f4f6fa' stroke='#001E62' stroke-width='2.5'/><text x='150.0' y='102.0' text-anchor='middle' font-size='22' font-weight='700' fill='#001E62'>Observe</text><text x='150.0' y='127.0' text-anchor='middle' font-size='16' fill='#656665'>agent reads everything</text><rect x='500' y='60' width='220' height='90' rx='10' fill='#f4f6fa' stroke='#001E62' stroke-width='2.5'/><text x='610.0' y='102.0' text-anchor='middle' font-size='22' font-weight='700' fill='#001E62'>Plan</text><text x='610.0' y='127.0' text-anchor='middle' font-size='16' fill='#656665'>agent proposes</text><rect x='500' y='300' width='220' height='90' rx='10' fill='#f4f6fa' stroke='#001E62' stroke-width='2.5'/><text x='610.0' y='342.0' text-anchor='middle' font-size='22' font-weight='700' fill='#001E62'>Act</text><text x='610.0' y='367.0' text-anchor='middle' font-size='16' fill='#656665'>agent edits, runs, replays</text><rect x='40' y='300' width='220' height='90' rx='10' fill='#fde8ec' stroke='#D50032' stroke-width='2.5'/><text x='150.0' y='342.0' text-anchor='middle' font-size='22' font-weight='700' fill='#D50032'>Verify</text><text x='150.0' y='367.0' text-anchor='middle' font-size='16' fill='#656665'>you pick the property + input</text><line x1='262' y1='105' x2='498' y2='105' stroke='#656665' stroke-width='2.5' marker-end='url(#a)'/><line x1='610' y1='152' x2='610' y2='298' stroke='#656665' stroke-width='2.5' marker-end='url(#a)'/><line x1='498' y1='345' x2='262' y2='345' stroke='#656665' stroke-width='2.5' marker-end='url(#a)'/><line x1='150' y1='298' x2='150' y2='152' stroke='#656665' stroke-width='2.5' marker-end='url(#a)'/><rect x='770' y='60' width='290' height='330' rx='12' fill='none' stroke='#001E62' stroke-width='2.5' stroke-dasharray='8 6'/><text x='915' y='100' font-size='19' fill='#001E62' text-anchor='middle' font-weight="700">Guardrails the agent</text><text x='915' y='126' font-size='19' fill='#001E62' text-anchor='middle' font-weight="700">cannot argue with</text><text x='800' y='175' font-size='18' fill='#2b2b2b' text-anchor='start'>• a sanitizer build</text><text x='800' y='211' font-size='18' fill='#2b2b2b' text-anchor='start'>• the original PoC</text><text x='800' y='247' font-size='18' fill='#2b2b2b' text-anchor='start'>• a held-out input</text><text x='800' y='283' font-size='18' fill='#2b2b2b' text-anchor='start'>• a prod DB it can't reach</text><text x='800' y='319' font-size='18' fill='#2b2b2b' text-anchor='start'>• a revoked API key</text>
