<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 360' width='1080' height='360' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#656665'/></marker></defs>
<line x1='60' y1='110' x2='1020' y2='110' stroke='#656665' stroke-width='3'/><circle cx='130' cy='110' r='9' fill='#2b2b2b'/><text x='130' y='80' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">Mar 20, 2025</text><text x='130' y='150' font-size='16' fill='#2b2b2b' text-anchor='middle'>researcher finds it</text><circle cx='340' cy='110' r='9' fill='#2b2b2b'/><text x='340' y='80' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">Mar 21</text><text x='340' y='150' font-size='16' fill='#2b2b2b' text-anchor='middle'>reported to Lovable</text><circle cx='550' cy='110' r='9' fill='#0A4FA3'/><text x='550' y='80' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">Apr 24</text><text x='550' y='150' font-size='16' fill='#2b2b2b' text-anchor='middle'>patch ships</text><circle cx='760' cy='110' r='9' fill='#D50032'/><text x='760' y='80' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">May 29</text><text x='760' y='150' font-size='16' fill='#2b2b2b' text-anchor='middle'>public, CVE-2025-48757</text><circle cx='960' cy='110' r='9' fill='#0A4FA3'/><text x='960' y='80' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">Jun 2025</text><text x='960' y='150' font-size='16' fill='#2b2b2b' text-anchor='middle'>scanner added to product</text><text x='540' y='40' font-size='19' fill='#001E62' text-anchor='middle' font-weight="700">Lovable: 170 of 1,645 scanned apps had data readable or writable by anyone</text><line x1='60' y1='290' x2='1020' y2='290' stroke='#656665' stroke-width='3'/><circle cx='130' cy='290' r='9' fill='#2b2b2b'/><text x='130' y='260' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">Day 9 of 12</text><text x='130' y='330' font-size='16' fill='#2b2b2b' text-anchor='middle'>"code freeze" declared</text><circle cx='400' cy='290' r='9' fill='#D50032'/><text x='400' y='260' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">Day 9</text><text x='400' y='330' font-size='16' fill='#2b2b2b' text-anchor='middle'>agent drops the prod DB</text><circle cx='670' cy='290' r='9' fill='#D50032'/><text x='670' y='260' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">Day 9, later</text><text x='670' y='330' font-size='16' fill='#2b2b2b' text-anchor='middle'>agent misreports what it did</text><circle cx='960' cy='290' r='9' fill='#0A4FA3'/><text x='960' y='260' font-size='16' fill='#656665' text-anchor='middle' font-weight="700">Jul 21</text><text x='960' y='330' font-size='16' fill='#2b2b2b' text-anchor='middle'>dev/prod DB separation</text><text x='540' y='220' font-size='19' fill='#001E62' text-anchor='middle' font-weight="700">Replit, July 2025: the agent was told, repeatedly, not to touch production</text>
</svg>
