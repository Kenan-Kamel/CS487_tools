<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 420' width='1080' height='420' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#656665'/></marker></defs>
<rect x='40' y='60' width='220' height='90' rx='10' fill='#f4f6fa' stroke='#001E62' stroke-width='2.5'/><text x='150.0' y='102.0' text-anchor='middle' font-size='22' font-weight='700' fill='#001E62'>Observe</text><text x='150.0' y='127.0' text-anchor='middle' font-size='16' fill='#656665'>files, crash logs, tool output</text><rect x='500' y='60' width='220' height='90' rx='10' fill='#f4f6fa' stroke='#001E62' stroke-width='2.5'/><text x='610.0' y='102.0' text-anchor='middle' font-size='22' font-weight='700' fill='#001E62'>Plan</text><text x='610.0' y='127.0' text-anchor='middle' font-size='16' fill='#656665'>decide what to try</text><rect x='500' y='300' width='220' height='90' rx='10' fill='#f4f6fa' stroke='#001E62' stroke-width='2.5'/><text x='610.0' y='342.0' text-anchor='middle' font-size='22' font-weight='700' fill='#001E62'>Act</text><text x='610.0' y='367.0' text-anchor='middle' font-size='16' fill='#656665'>edit · compile · run · tools</text><rect x='40' y='300' width='220' height='90' rx='10' fill='#fde8ec' stroke='#D50032' stroke-width='2.5'/><text x='150.0' y='342.0' text-anchor='middle' font-size='22' font-weight='700' fill='#D50032'>Verify</text><text x='150.0' y='367.0' text-anchor='middle' font-size='16' fill='#656665'>did it work?</text><line x1='262' y1='105' x2='498' y2='105' stroke='#656665' stroke-width='2.5' marker-end='url(#a)'/><line x1='610' y1='152' x2='610' y2='298' stroke='#656665' stroke-width='2.5' marker-end='url(#a)'/><line x1='498' y1='345' x2='262' y2='345' stroke='#656665' stroke-width='2.5' marker-end='url(#a)'/><line x1='150' y1='298' x2='150' y2='152' stroke='#656665' stroke-width='2.5' marker-end='url(#a)'/><text x='150.0' y='215.0' text-anchor='middle' font-size='16' fill='#656665'>loop</text><text x='380' y='230' font-size='26' fill='#001E62' text-anchor='middle' font-weight="700">LLM</text><text x='380' y='258' font-size='15' fill='#656665' text-anchor='middle'>one model call per step</text><text x='770' y='90' font-size='18' fill='#001E62' text-anchor='start' font-weight="700">Tools it can call</text><text x='770' y='125' font-size='17' fill='#2b2b2b' text-anchor='start'>• shell, gcc, gdb, sanitizers</text><text x='770' y='157' font-size='17' fill='#2b2b2b' text-anchor='start'>• tshark, Ghidra, CodeQL via MCP</text><text x='770' y='189' font-size='17' fill='#2b2b2b' text-anchor='start'>• the test suite</text><text x='770' y='221' font-size='17' fill='#D50032' text-anchor='start'>• the production database</text><text x='770' y='300' font-size='16' fill='#656665' text-anchor='start'>The Verify step is where</text><text x='770' y='324' font-size='16' fill='#656665' text-anchor='start'>the agent decides what</text><text x='770' y='348' font-size='16' fill='#656665' text-anchor='start'>"it worked" means.</text>
</svg>
